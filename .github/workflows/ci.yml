name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, production]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile
        run: |
          python -m compileall core generators main.py run.py
      - name: Build (portable)
        run: |
          python -m PyInstaller --noconsole --clean --noconfirm --name correagro_extractor --add-data=assets:assets --add-data=update_repo.txt:. run.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: correagro_extractor-portable
          path: dist/correagro_extractor
